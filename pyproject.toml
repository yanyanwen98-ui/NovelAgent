[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "A highly autonomous long-form novel creation agent."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6"
]

[project.scripts]
novel-agent = "novel_agent.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
